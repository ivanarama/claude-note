<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>claude-note</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232733;
    --border: #2e3348;
    --text: #e1e4ed;
    --text2: #8b8fa3;
    --accent: #6c7ee1;
    --accent2: #8b9cf7;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --cyan: #22d3ee;
    --purple: #a78bfa;
    --orange: #fb923c;
    --radius: 8px;
    --font: 'Inter', -apple-system, system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent2); }

  .worker-status {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .status-badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: 600;
  }
  .status-badge.running { color: var(--green); background: #4ade8018; }
  .status-badge.stopped { color: var(--text2); background: var(--surface2); }
  .status-badge.qmd-active { color: var(--purple); background: #a78bfa18; }
  .status-badge.qmd-off { color: var(--text2); background: var(--surface2); opacity: 0.6; }

  /* Stats row */
  .stats-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    flex: 1;
    min-width: 140px;
  }
  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text2);
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 24px;
    font-weight: 700;
  }

  /* Controls */
  .controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 20px;
  }
  .controls-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    padding: 9px 18px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--border); }
  .btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 4px; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }

  .model-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .model-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .model-item .model-name { flex: 1; }
  .model-item .model-actions { display: flex; gap: 4px; }
  .model-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--surface2);
    color: var(--accent2);
    margin-right: 6px;
  }
  .model-name-only { color: var(--text); }

  /* Filter & Search */
  .search-filter-area {
    margin-bottom: 16px;
  }
  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    align-items: center;
  }
  .search-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    padding: 7px 12px;
    font-family: var(--font);
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .search-input::placeholder { color: var(--text2); }

  .filter-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-section {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-sep {
    width: 1px;
    height: 20px;
    background: var(--border);
    margin: 0 4px;
  }
  .filter-btn {
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: transparent;
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .filter-btn.project-btn.active { background: var(--surface2); color: var(--accent2); border-color: var(--accent2); }

  /* Session list */
  .session-list { display: flex; flex-direction: column; gap: 8px; }

  .session-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    transition: border-color .15s;
  }
  .session-row:hover { border-color: var(--accent); }

  .session-header {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }
  .session-toggle {
    color: var(--text2);
    font-size: 11px;
    min-width: 12px;
    transition: color .15s;
  }
  .session-row:hover .session-toggle { color: var(--accent); }
  .session-id {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    min-width: 70px;
  }
  .session-status {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .session-status.written { color: var(--green); background: #4ade8015; }
  .session-status.pending { color: var(--yellow); background: #fbbf2415; }
  .session-status.processing { color: var(--cyan); background: #22d3ee15; }

  .session-model {
    font-size: 11px;
    font-weight: 500;
    color: var(--purple);
    background: #a855f715;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: var(--mono);
  }
  .session-project {
    font-size: 11px;
    color: var(--accent2);
    font-family: var(--mono);
    background: #6c7ee115;
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  .session-project:hover { background: #6c7ee130; }

  .session-cwd {
    flex: 1;
    font-size: 12px;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: var(--mono);
    min-width: 0;
  }
  .session-meta {
    font-size: 11px;
    color: var(--text2);
    font-family: var(--mono);
  }
  .session-time {
    font-size: 11px;
    color: var(--accent2);
    font-family: var(--mono);
  }

  /* Session detail */
  .session-detail {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .session-row.expanded .session-detail { display: block; }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  @media (max-width: 600px) { .detail-grid { grid-template-columns: 1fr; } }

  .detail-block {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
  }
  .detail-block-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text2);
    margin-bottom: 6px;
  }
  .detail-block-value {
    font-size: 12px;
    color: var(--text);
    font-family: var(--mono);
    word-break: break-all;
  }

  /* Synth results */
  .synth-results {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .synth-badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    font-family: var(--mono);
  }
  .synth-badge.note-created { color: var(--green); background: #4ade8015; border: 1px solid #4ade8030; }
  .synth-badge.note-updated { color: var(--cyan); background: #22d3ee15; border: 1px solid #22d3ee30; }
  .synth-badge.inbox { color: var(--yellow); background: #fbbf2415; border: 1px solid #fbbf2430; }
  .synth-badge.memory { color: var(--purple); background: #a78bfa15; border: 1px solid #a78bfa30; }
  .synth-badge.concepts { color: var(--accent2); background: #6c7ee115; border: 1px solid #6c7ee130; }

  /* Events timeline */
  .events-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text2);
    margin-bottom: 8px;
  }
  .events-timeline {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: 14px;
    max-height: 400px;
    overflow-y: auto;
  }
  .ev-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
  }
  .ev-row:hover { background: var(--surface2); }
  .ev-row.ev-user { border-left: 2px solid var(--accent); padding-left: 6px; }
  .ev-row.ev-stop { opacity: 0.4; }
  .ev-time {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text2);
    min-width: 50px;
    margin-top: 1px;
  }
  .ev-badge {
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 3px;
    font-weight: 600;
    font-family: var(--mono);
    min-width: 54px;
    text-align: center;
    flex-shrink: 0;
  }
  .ev-badge.write { color: var(--green); background: #4ade8020; }
  .ev-badge.edit  { color: var(--yellow); background: #fbbf2420; }
  .ev-badge.read  { color: var(--text2); background: var(--surface2); }
  .ev-badge.bash  { color: var(--orange); background: #fb923c20; }
  .ev-badge.user  { color: var(--accent2); background: #6c7ee120; }
  .ev-badge.stop  { color: var(--text2); background: transparent; }
  .ev-badge.tool  { color: var(--cyan); background: #22d3ee20; }
  .ev-badge.glob  { color: var(--text2); background: var(--surface2); }
  .ev-badge.grep  { color: var(--text2); background: var(--surface2); }
  .ev-text {
    flex: 1;
    color: var(--text);
    font-family: var(--mono);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ev-text.dim { color: var(--text2); }

  .events-loading {
    color: var(--text2);
    font-size: 12px;
    padding: 8px;
    font-style: italic;
  }

  /* Timeline legend + controls */
  .timeline-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 11px;
    color: var(--text2);
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }

  .events-controls {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
  }
  .toggle-reads {
    font-size: 11px;
    color: var(--text2);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    background: none;
    border: none;
    padding: 0;
  }
  .toggle-reads:hover { color: var(--accent2); }

  /* Synthesis result links */
  .synth-badge a {
    color: inherit;
    text-decoration: none;
  }
  .synth-badge a:hover { text-decoration: underline; }

  .detail-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  /* Logs */
  .logs-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-top: 24px;
  }
  .logs-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logs-title {
    font-size: 13px;
    font-weight: 600;
  }
  .logs-content {
    max-height: 250px;
    overflow-y: auto;
    padding: 12px;
    font-family: var(--mono);
    font-size: 11px;
  }
  .log-entry {
    padding: 4px 0;
    display: flex;
    gap: 8px;
  }
  .log-time { color: var(--text2); }
  .log-level { color: var(--accent2); min-width: 60px; }
  .log-msg { color: var(--text); }
  .log-error { color: var(--red); }
  .log-warn { color: var(--yellow); }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text2);
  }

  /* Config modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    max-width: 500px;
    width: 90%;
  }
  .modal-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .modal-body { margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-label {
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 6px;
    display: block;
  }
  .form-input, .form-select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    padding: 8px 12px;
  }
  .form-input:focus, .form-select:focus { outline: none; border-color: var(--accent); }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">claude<span>-note</span></div>
    <div class="worker-status">
      <span class="status-badge" id="qmdBadge" title="qmd vector search"></span>
      <span class="status-badge" id="workerBadge">checking...</span>
    </div>
  </header>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Queue Events</div>
      <div class="stat-value" id="queueEvents">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">All Sessions</div>
      <div class="stat-value" id="totalSessions">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Written</div>
      <div class="stat-value" style="color: var(--green);" id="writtenSessions">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Pending</div>
      <div class="stat-value" style="color: var(--yellow);" id="pendingSessions">-</div>
    </div>
  </div>

  <div class="controls">
    <div class="controls-row">
      <button class="btn btn-primary" id="startBtn" onclick="startWorker()">Start Worker</button>
      <button class="btn btn-danger" id="stopBtn" onclick="stopWorker()">Stop Worker</button>
      <button class="btn btn-ghost" onclick="openModelConfig()">Configure Models</button>
    </div>
  </div>

  <div class="search-filter-area">
    <div class="search-row">
      <input class="search-input" id="searchInput" type="text"
        placeholder="Search by session ID or path..."
        oninput="onSearchInput()">
      <button class="btn btn-sm btn-ghost" onclick="clearSearch()" id="clearSearchBtn" style="display:none">Clear</button>
    </div>
    <div class="filter-bar">
      <div class="filter-section" id="statusFilters">
        <button class="filter-btn active" data-filter="">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="written">Written</button>
      </div>
      <div class="filter-sep" id="projSep" style="display:none"></div>
      <div class="filter-section" id="projectFilters"></div>
    </div>
  </div>

  <div class="session-list" id="sessionList"></div>

  <div class="logs-panel">
    <div class="logs-header">
      <span class="logs-title">Recent Logs</span>
      <button class="btn btn-sm btn-ghost" onclick="refreshLogs()">Refresh</button>
    </div>
    <div class="logs-content" id="logsContent"></div>
  </div>
</div>

<!-- Model Config Modal -->
<div class="modal-overlay" id="modelModal">
  <div class="modal">
    <div class="modal-title">Model Configuration</div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Models (in order of preference)</label>
        <div id="modelList" class="model-list"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Add Model</label>
        <div style="display: flex; gap: 8px;">
          <select class="form-select" id="modelPresetSelect" style="flex: 1;" onchange="onPresetSelect()">
            <option value="">-- Select preset or type custom --</option>
          </select>
          <input type="text" class="form-input" id="newModelInput" placeholder="or type custom..." style="flex: 1;">
          <button class="btn btn-sm btn-primary" onclick="addModel()">Add</button>
        </div>
        <div style="font-size: 11px; color: var(--text2); margin-top: 4px;">
          Use <code>profile:model</code> for custom providers (e.g., <code>claude-z:glm-4.7</code>), or just model name for default claude CLI.
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModelConfig()">Cancel</button>
      <button class="btn btn-primary" onclick="saveModelConfig()">Save</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
let currentFilter = '';
let currentProject = '';
let searchQuery = '';
let expandedId = null;
let modelsCache = [];
let allSessions = [];         // full list loaded from API
let detailsCache = {};        // session_id -> detail with events
let showReads = {};           // session_id -> bool (show read events)
let vaultName = '';           // Obsidian vault name for obsidian:// links
let inboxPath = '';           // relative path to inbox note in vault

// === API calls ===
async function apiCall(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// === Status ===
async function loadStatus() {
  const s = await apiCall(`${API}/status`);

  // Worker badge
  const badge = document.getElementById('workerBadge');
  if (s.worker.running) {
    badge.textContent = 'running';
    badge.className = 'status-badge running';
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
  } else {
    badge.textContent = 'stopped';
    badge.className = 'status-badge stopped';
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
  }

  // qmd badge
  const qmdBadge = document.getElementById('qmdBadge');
  const q = s.qmd || {};
  if (q.available && q.enabled) {
    qmdBadge.textContent = `qmd ${q.doc_count || 0} docs`;
    qmdBadge.className = 'status-badge qmd-active';
    qmdBadge.title = `qmd: installed, ${q.doc_count} docs indexed`;
  } else if (q.doc_count === 0 && q.enabled !== false) {
    // Installed but index empty
    qmdBadge.textContent = 'qmd empty';
    qmdBadge.className = 'status-badge qmd-off';
    qmdBadge.title = 'qmd installed but index is empty — run: qmd index vault';
  } else if (!q.available && q.enabled) {
    qmdBadge.textContent = 'qmd —';
    qmdBadge.className = 'status-badge qmd-off';
    qmdBadge.title = 'qmd not installed';
  } else {
    qmdBadge.textContent = 'qmd off';
    qmdBadge.className = 'status-badge qmd-off';
    qmdBadge.title = 'qmd disabled in config';
  }

  // Stats
  document.getElementById('queueEvents').textContent = s.queue.events;
  document.getElementById('totalSessions').textContent = s.queue.sessions;
  document.getElementById('writtenSessions').textContent = s.queue.written;
  document.getElementById('pendingSessions').textContent = s.queue.pending;

  modelsCache = s.config.models || [];
  vaultName = s.config.vault_name || '';
  inboxPath = s.config.inbox_path || '';
}

// === Sessions ===
async function loadSessions() {
  const params = currentFilter ? `?status=${currentFilter}&limit=200` : '?limit=200';
  allSessions = await apiCall(`${API}/sessions${params}`);
  buildProjectFilter();
  renderSessions();
}

function getProjectName(cwd) {
  if (!cwd) return null;
  const parts = cwd.replace(/\\/g, '/').split('/').filter(Boolean);
  if (parts.length >= 2) return parts[parts.length - 2] + '/' + parts[parts.length - 1];
  if (parts.length === 1) return parts[0];
  return null;
}

function buildProjectFilter() {
  const projects = new Map(); // name -> count
  for (const s of allSessions) {
    const name = getProjectName(s.cwd);
    if (name) projects.set(name, (projects.get(name) || 0) + 1);
  }

  const container = document.getElementById('projectFilters');
  const sep = document.getElementById('projSep');

  // Only show projects with >1 session or if we have filtered ones
  const sorted = [...projects.entries()]
    .sort((a, b) => b[1] - a[1])
    .slice(0, 8); // limit to 8 most common projects

  if (sorted.length > 1) {
    sep.style.display = '';
    container.innerHTML = sorted.map(([name, count]) => {
      const active = currentProject === name ? ' active project-btn' : ' project-btn';
      return `<button class="filter-btn${active}" data-project="${esc(name)}" onclick="setProjectFilter('${esc(name)}')">${esc(name)} <span style="opacity:.5">${count}</span></button>`;
    }).join('');
  } else {
    sep.style.display = 'none';
    container.innerHTML = '';
  }
}

function setProjectFilter(name) {
  if (currentProject === name) {
    currentProject = '';
  } else {
    currentProject = name;
  }
  // Update button states
  document.querySelectorAll('#projectFilters .filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.project === currentProject);
  });
  renderSessions();
}

function renderSessions() {
  let sessions = allSessions;

  // Apply project filter
  if (currentProject) {
    sessions = sessions.filter(s => getProjectName(s.cwd) === currentProject);
  }

  // Apply search
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    sessions = sessions.filter(s =>
      s.session_id.toLowerCase().includes(q) ||
      (s.cwd || '').toLowerCase().includes(q)
    );
  }

  const list = document.getElementById('sessionList');

  if (!sessions.length) {
    list.innerHTML = `<div class="empty">No sessions found${currentFilter ? ' with status "' + currentFilter + '"' : ''}${currentProject ? ' in project "' + esc(currentProject) + '"' : ''}${searchQuery ? ' matching "' + esc(searchQuery) + '"' : ''}.</div>`;
    return;
  }

  list.innerHTML = sessions.map(s => {
    const expanded = s.session_id === expandedId;
    const timeDisplay = (s.last_event || s.last_write) ? formatTime(s.last_event || s.last_write) : '';
    const modelDisplay = s.synth_model ? `<span class="session-model" title="${esc(s.synth_model)}">${esc(s.synth_model)}</span>` : '';
    const projectName = getProjectName(s.cwd);
    const projectDisplay = projectName ? `<span class="session-project" title="${esc(s.cwd)}" onclick="event.stopPropagation();setProjectFilter('${esc(projectName)}')">${esc(projectName)}</span>` : '';

    let detailHtml = '';
    if (expanded) {
      detailHtml = buildDetailHtml(s);
    }

    return `
    <div class="session-row${expanded ? ' expanded' : ''}" id="sr-${s.session_id}">
      <div class="session-header" onclick="toggleSession('${s.session_id}')">
        <span class="session-toggle">${expanded ? '&#9660;' : '&#9654;'}</span>
        <span class="session-id">${s.session_id.slice(0, 8)}</span>
        <span class="session-status ${s.status}">${s.status === 'written' ? 'done' : 'pending'}</span>
        ${modelDisplay}
        ${projectDisplay}
        <span class="session-cwd" title="${esc(s.cwd || '')}">${esc(s.cwd || 'unknown')}</span>
        <span class="session-meta">${s.event_count} ev</span>
        ${timeDisplay ? `<span class="session-time">${timeDisplay}</span>` : ''}
      </div>
      <div class="session-detail">${detailHtml}</div>
    </div>`;
  }).join('');
}

function buildDetailHtml(s) {
  const detail = detailsCache[s.session_id];

  // Synthesis results section
  let synthHtml = '';
  const r = s.synth_results;
  if (r) {
    const badges = [];
    if (r.inbox_updated) {
      const href = vaultName && inboxPath ? `obsidian://open?vault=${encodeURIComponent(vaultName)}&file=${encodeURIComponent(inboxPath)}` : '';
      const inner = href ? `<a href="${href}" title="Open inbox in Obsidian">inbox updated</a>` : 'inbox updated';
      badges.push(`<span class="synth-badge inbox">${inner}</span>`);
    }
    if (r.notes_created && r.notes_created.length) {
      r.notes_created.forEach(n => {
        const href = vaultName ? `obsidian://open?vault=${encodeURIComponent(vaultName)}&file=${encodeURIComponent(n.replace(/\\/g,'/'))}` : '';
        const inner = href ? `<a href="${href}" title="Open note in Obsidian">+ ${esc(n)}</a>` : `+ ${esc(n)}`;
        badges.push(`<span class="synth-badge note-created">${inner}</span>`);
      });
    }
    if (r.notes_updated && r.notes_updated.length) {
      r.notes_updated.forEach(n => {
        const href = vaultName ? `obsidian://open?vault=${encodeURIComponent(vaultName)}&file=${encodeURIComponent(n.replace(/\\/g,'/'))}` : '';
        const inner = href ? `<a href="${href}" title="Open note in Obsidian">~ ${esc(n)}</a>` : `~ ${esc(n)}`;
        badges.push(`<span class="synth-badge note-updated">${inner}</span>`);
      });
    }
    if (r.concepts) badges.push(`<span class="synth-badge concepts">${r.concepts} concepts, ${r.decisions || 0} decisions</span>`);
    if (r.memory_updated) {
      const mem = `memory +${r.memory_entries_added}/-${r.memory_entries_removed}`;
      const href = r.memory_path ? `file:///${r.memory_path.replace(/\\/g,'/')}` : '';
      const inner = href ? `<a href="${href}" title="Open MEMORY.md">${mem}</a>` : mem;
      badges.push(`<span class="synth-badge memory">${inner}</span>`);
    }
    if (badges.length) {
      synthHtml = `<div class="events-title">Synthesis results</div><div class="synth-results">${badges.join('')}</div>`;
    }
  }

  // Info grid
  const infoHtml = `
  <div class="detail-grid">
    <div class="detail-block">
      <div class="detail-block-title">Session ID</div>
      <div class="detail-block-value">${s.session_id}</div>
    </div>
    <div class="detail-block">
      <div class="detail-block-title">Project path</div>
      <div class="detail-block-value">${esc(s.cwd || '—')}</div>
    </div>
    ${s.last_event ? `
    <div class="detail-block">
      <div class="detail-block-title">Last activity</div>
      <div class="detail-block-value">${new Date(s.last_event).toLocaleString()}</div>
    </div>` : ''}
    ${s.last_write ? `
    <div class="detail-block">
      <div class="detail-block-title">Synthesized at</div>
      <div class="detail-block-value">${new Date(s.last_write).toLocaleString()}</div>
    </div>` : ''}
  </div>`;

  // Events timeline
  let eventsHtml = '';
  if (!detail) {
    eventsHtml = `<div class="events-loading">Loading events...</div>`;
    fetchDetail(s.session_id);
  } else if (detail.events && detail.events.length) {
    const sessionStart = new Date(detail.events[0].ts);
    const showR = showReads[s.session_id] !== false; // default show
    const readCount = detail.events.filter(e => isReadEvent(e)).length;
    const visibleCount = showR ? detail.events.length : detail.events.length - readCount;

    const rows = detail.events.map(e => {
      const parsed = parseEvent(e);
      if (!showR && parsed.type === 'read') return '';
      if (!showR && (parsed.type === 'glob' || parsed.type === 'grep')) return '';
      const elapsed = formatElapsed(new Date(e.ts) - sessionStart);
      const dimClass = (parsed.type === 'read' || parsed.type === 'glob' || parsed.type === 'grep' || parsed.type === 'stop') ? ' dim' : '';
      return `<div class="ev-row ev-${parsed.type}">
        <span class="ev-time">+${elapsed}</span>
        <span class="ev-badge ${parsed.type}">${esc(parsed.label)}</span>
        <span class="ev-text${dimClass}" title="${esc(e.description || '')}">${esc(parsed.text)}</span>
      </div>`;
    }).join('');

    // Legend
    const legendHtml = `
    <div class="timeline-legend">
      <span style="font-weight:600;margin-right:4px">Legend:</span>
      <span class="legend-item"><span class="ev-badge user" style="font-size:10px;padding:1px 6px;">user</span> ваш промпт</span>
      <span class="legend-item"><span class="ev-badge write" style="font-size:10px;padding:1px 6px;">Write</span> создан файл</span>
      <span class="legend-item"><span class="ev-badge edit" style="font-size:10px;padding:1px 6px;">Edit</span> изменён файл</span>
      <span class="legend-item"><span class="ev-badge bash" style="font-size:10px;padding:1px 6px;">Bash</span> команда</span>
      <span class="legend-item"><span class="ev-badge read" style="font-size:10px;padding:1px 6px;">Read</span> чтение (${readCount} шт.)</span>
      <span class="legend-item"><span class="ev-badge stop" style="font-size:10px;padding:1px 6px;">stop</span> сессия остановлена</span>
      <span style="color:var(--text2);font-size:10px">+0s = время от начала сессии</span>
    </div>`;

    const toggleLabel = showR
      ? `Скрыть чтение файлов (${readCount} строк)`
      : `Показать чтение файлов (${readCount} строк)`;
    const controlsHtml = readCount > 0 ? `
    <div class="events-controls">
      <button class="toggle-reads" onclick="toggleReads('${s.session_id}')">${toggleLabel}</button>
      <span style="font-size:11px;color:var(--text2)">показано ${visibleCount} из ${detail.events.length}</span>
    </div>` : '';

    eventsHtml = `
    <div class="events-title">Timeline (${detail.events.length} событий)</div>
    ${legendHtml}
    ${controlsHtml}
    <div class="events-timeline">${rows}</div>`;
  }

  // Actions
  const actionsHtml = `
  <div class="detail-actions">
    <button class="btn btn-sm btn-primary" onclick="retrySession(event, '${s.session_id}')">Retry Synthesis</button>
  </div>`;

  return synthHtml + infoHtml + eventsHtml + actionsHtml;
}

const SCAN_TOOLS = new Set(['read', 'glob', 'grep']);

function isReadEvent(e) {
  if (e.event !== 'PostToolUse') return false;
  const m = e.description && e.description.match(/\*\*(\w+)\*\*/);
  return m ? SCAN_TOOLS.has(m[1].toLowerCase()) : false;
}

function parseEvent(e) {
  if (e.event === 'UserPromptSubmit') {
    let text = e.description || '';
    text = text.replace(/^User prompt: /, '').replace(/^"(.*)"$/, '$1');
    if (text.length > 80) text = text.slice(0, 80) + '...';
    return { type: 'user', label: 'user', text };
  }
  if (e.event === 'Stop') {
    return { type: 'stop', label: 'stop', text: 'session stopped' };
  }
  if (e.event === 'PostToolUse') {
    const m = (e.description || '').match(/\*\*(\w+)\*\*\s*`([^`]*)`/);
    if (m) {
      const tool = m[1].toLowerCase();
      const arg = m[2];
      return { type: tool, label: m[1], text: arg };
    }
    return { type: 'tool', label: 'tool', text: e.description || '' };
  }
  return { type: 'other', label: e.event, text: e.description || '' };
}

function formatElapsed(ms) {
  if (ms < 0) return '0s';
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  const rem = s % 60;
  return m + 'm' + (rem ? rem + 's' : '');
}

async function fetchDetail(id) {
  try {
    const detail = await apiCall(`${API}/sessions/${id}`);
    detailsCache[id] = detail;
    const s = allSessions.find(x => x.session_id === id);
    if (s && expandedId === id) {
      const row = document.getElementById('sr-' + id);
      if (row) {
        const tl = row.querySelector('.events-timeline');
        const savedTl = tl ? tl.scrollTop : 0;
        const detailEl = row.querySelector('.session-detail');
        if (detailEl) detailEl.innerHTML = buildDetailHtml(s);
        if (savedTl) {
          const newTl = row.querySelector('.events-timeline');
          if (newTl) newTl.scrollTop = savedTl;
        }
      }
    }
  } catch (e) {
    console.error('Failed to fetch session detail:', e);
  }
}

function toggleReads(id) {
  showReads[id] = showReads[id] === false ? true : false;
  const s = allSessions.find(x => x.session_id === id);
  if (s && expandedId === id) {
    const row = document.getElementById('sr-' + id);
    if (row) {
      const detailEl = row.querySelector('.session-detail');
      if (detailEl) detailEl.innerHTML = buildDetailHtml(s);
    }
  }
}

async function retrySession(e, id) {
  e.stopPropagation();
  try {
    await apiCall(`${API}/sessions/${id}/retry`, { method: 'POST' });
    // Invalidate cache for this session
    delete detailsCache[id];
    await loadSessions();
  } catch (err) {
    alert('Retry failed: ' + err.message);
  }
}

async function toggleSession(id) {
  if (expandedId === id) {
    expandedId = null;
  } else {
    expandedId = id;
    // Pre-fetch detail if not cached
    if (!detailsCache[id]) {
      fetchDetail(id); // async, will re-render when done
    }
  }
  renderSessions();
}

// === Search ===
function onSearchInput() {
  searchQuery = document.getElementById('searchInput').value;
  document.getElementById('clearSearchBtn').style.display = searchQuery ? '' : 'none';
  renderSessions();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  searchQuery = '';
  document.getElementById('clearSearchBtn').style.display = 'none';
  renderSessions();
}

// === Worker ===
async function startWorker() {
  await apiCall(`${API}/worker/start`, { method: 'POST' });
  refresh();
}

async function stopWorker() {
  await apiCall(`${API}/worker/stop`, { method: 'POST' });
  refresh();
}

// === Status filters ===
document.getElementById('statusFilters').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('#statusFilters .filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentFilter = e.target.dataset.filter;
  loadSessions();
});

// === Model Config ===
let modelSuggestions = [];

async function openModelConfig() {
  await loadStatus();
  renderModelList();
  loadModelPresets();
  document.getElementById('modelModal').classList.add('active');
}

function closeModelConfig() {
  document.getElementById('modelModal').classList.remove('active');
}

async function loadModelPresets() {
  try {
    const data = await apiCall(`${API}/models`);
    modelSuggestions = data.suggestions || [];
    const select = document.getElementById('modelPresetSelect');
    select.innerHTML = '<option value="">-- Select preset or type custom --</option>';
    modelSuggestions.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.value;
      opt.textContent = s.label;
      select.appendChild(opt);
    });
  } catch (e) {
    console.error('Failed to load model presets:', e);
  }
}

function onPresetSelect() {
  const select = document.getElementById('modelPresetSelect');
  const input = document.getElementById('newModelInput');
  if (select.value) input.value = select.value;
}

function renderModelList() {
  const list = document.getElementById('modelList');

  function parseModel(entry) {
    if (entry.includes(':')) {
      const [profile, model] = entry.split(':', 2);
      return { profile, model, full: entry };
    }
    return { profile: '', model: entry, full: entry };
  }

  list.innerHTML = modelsCache.map((m, i) => {
    const { profile, model } = parseModel(m);
    const display = profile
      ? `<span class="model-badge">${esc(profile)}</span><span class="model-name-only">${esc(model)}</span>`
      : `<span class="model-name-only">${esc(model)}</span>`;

    return `
    <div class="model-item">
      <span class="model-name">${display}</span>
      <div class="model-actions">
        <button class="btn btn-sm btn-ghost" onclick="moveModel(${i}, -1)" ${i === 0 ? 'disabled' : ''}>&#8593;</button>
        <button class="btn btn-sm btn-ghost" onclick="moveModel(${i}, 1)" ${i === modelsCache.length - 1 ? 'disabled' : ''}>&#8595;</button>
        <button class="btn btn-sm btn-danger" onclick="removeModel(${i})">&#215;</button>
      </div>
    </div>`;
  }).join('');
}

function moveModel(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= modelsCache.length) return;
  [modelsCache[idx], modelsCache[newIdx]] = [modelsCache[newIdx], modelsCache[idx]];
  renderModelList();
}

function removeModel(idx) {
  if (modelsCache.length <= 1) return alert('Need at least one model');
  modelsCache.splice(idx, 1);
  renderModelList();
}

function addModel() {
  const input = document.getElementById('newModelInput');
  const val = input.value.trim();
  if (!val) return;
  if (modelsCache.includes(val)) return alert('Model already in list');
  modelsCache.push(val);
  input.value = '';
  renderModelList();
}

async function saveModelConfig() {
  try {
    await apiCall(`${API}/models`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(modelsCache),
    });
    await loadStatus();
    closeModelConfig();
  } catch (err) {
    alert('Failed to save: ' + err.message);
    console.error('Save error:', err);
  }
}

// === Logs ===
async function loadLogs() {
  const logs = await apiCall(`${API}/logs?limit=50`);
  const content = document.getElementById('logsContent');

  if (!logs.length) {
    content.innerHTML = '<div style="color: var(--text2); text-align: center; padding: 20px;">No logs yet</div>';
    return;
  }

  content.innerHTML = logs.map(l => {
    let levelClass = 'log-msg';
    if (l.level === 'ERROR') levelClass = 'log-error';
    else if (l.level === 'WARNING') levelClass = 'log-warn';

    const timePart = l.timestamp.split(' ')[1]?.slice(0, 8) || '';
    return `
    <div class="log-entry">
      <span class="log-time">${timePart}</span>
      <span class="log-level">${l.level}</span>
      <span class="${levelClass}">${esc(l.message)}</span>
    </div>`;
  }).join('');
}

function refreshLogs() { loadLogs(); }

// === Helpers ===
function esc(s) {
  const d = document.createElement('div');
  d.textContent = String(s || '');
  return d.innerHTML;
}

function formatTime(isoString) {
  const date = new Date(isoString);
  const now = new Date();
  const diff = now - date;

  if (diff < 60000) return Math.floor(diff / 1000) + 's';
  if (diff < 3600000) return Math.floor(diff / 60000) + 'm';
  if (diff < 86400000) return Math.floor(diff / 3600000) + 'h';
  return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
}

function refresh() { loadStatus(); if (!expandedId) loadSessions(); loadLogs(); }

// === Init ===
refresh();
setInterval(refresh, 8000);
</script>
</body>
</html>
